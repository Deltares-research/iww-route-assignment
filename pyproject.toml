[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "iww-route-assignment"
version = "0.1.0"
description = "Auditable inland-waterway route assignment modelling"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Deltares research and development" }]
keywords = ["inland-waterways", "routing", "transport", "assignment"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.1.1"]
dev = [
    "build>=1.2",
    "hypothesis>=6.130",
    "mypy>=1.15",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[project.urls]
Repository = "https://github.com/Deltares-research/iww-route-assignment"
Issues = "https://github.com/Deltares-research/iww-route-assignment/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/iww_route_assignment"]

[tool.hatch.build]
exclude = [
    "/.github/skills",
    "/.idea",
    "/data",
    "/notebooks",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["iww_route_assignment"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["iww_route_assignment"]
mypy_path = "src"
